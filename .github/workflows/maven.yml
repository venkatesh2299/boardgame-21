# Trigger Stages on Changes in Specific Files
name: Java CICD with Maven
on:
  push:
    branches: ["main"]

env:
  APP_NAME: devops-kmv-java

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      Java: ${{steps.filter.outputs.java}}
      docker: ${{steps.filter.outputs.docker}}
      My-Test: ${{steps.filter.outputs.mytest}}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            java:
              - 'src/**'
              - 'pom.xml'
              - '.mvn/**'
              - 'mvnw'
              - 'mvnw.cmd'
            docker:
              - 'Dockerfile'
              - 'docker/**'
            mytest:
              - 'My-Test/**'

  pre_build:
    name: pre-build
    runs-on: ubuntu-latest
    needs: Changes
    if: needs.changes.outputs.mytest == 'true'
    env:
      STAGE_NAME: before-build-package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: maven
      - run: |
          mvn test 
          echo "APP-name is: $APP_NAME"
          echo "Stage-name is: $STAGE_NAME"     

  build:
    name: maven build
    runs-on: ubuntu-latest
    needs: [changes, pre_build]
    env:
      STAGE_NAME: maven package
    if: needs.changes.outputs.java == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - run: |
          mvn package
          echo "App name: $APP_NAME" 
          echo "Stage name: $STAGE_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: boardgame-kmv
          path: target/*jar

      